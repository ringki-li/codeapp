name: Build Unsigned IPA for CodeApp

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build and Archive
        run: |
          # 根据官方参考代码，项目名和 Scheme 确定为 Code
          # 自动判断使用 workspace 还是 xcodeproj
          if [ -d "Code.xcworkspace" ]; then
            TARGET="-workspace Code.xcworkspace"
          else
            TARGET="-project Code.xcodeproj"
          fi
          
          echo "=> 正在使用目标: $TARGET, Scheme: Code 进行无签名编译..."

          xcodebuild archive \
            $TARGET \
            -scheme Code \
            -configuration Release \
            -archivePath $PWD/build/Code.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # 将编译出的 .app 提取并压缩为标准 .ipa 格式
          cp -r build/Code.xcarchive/Products/Applications/*.app Payload/
          zip -r Code.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: Code.ipa
          retention-days: 3
