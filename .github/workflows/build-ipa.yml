name: Build Unsigned IPA for CodeApp

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Package iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          fi
          if [ -f "Podfile" ]; then
            sudo gem install cocoapods
            pod install
          fi

      - name: Build and Archive
        run: |
          # 自动检测是 workspace 还是 xcodeproj
          if ls *.xcworkspace 1> /dev/null 2>&1; then
            TARGET="-workspace $(ls *.xcworkspace | head -n 1)"
          elif ls *.xcodeproj 1> /dev/null 2>&1; then
            TARGET="-project $(ls *.xcodeproj | head -n 1)"
          else
            echo "错误：找不到 .xcworkspace 或 .xcodeproj 文件！"
            ls -la
            exit 1
          fi
          
          # 自动解析获取项目的 Scheme
          SCHEME=$(xcodebuild -list -json | jq -r '.project.schemes[0] // .workspace.schemes[0]')
          if [ "$SCHEME" == "null" ] || [ -z "$SCHEME" ]; then
            SCHEME="CodeApp" # 兜底默认值
          fi
          
          echo "=> 探测到构建目标: $TARGET"
          echo "=> 探测到 Scheme: $SCHEME"

          xcodebuild archive \
            $TARGET \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath $PWD/build/CodeApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build/CodeApp.xcarchive/Products/Applications/*.app Payload/
          zip -r CodeApp.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: CodeApp.ipa
          retention-days: 3
