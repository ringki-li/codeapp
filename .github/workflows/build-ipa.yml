name: Build Unsigned IPA for CodeApp

on:
  workflow_dispatch: # 允许你手动点击按钮触发编译

jobs:
  build:
    name: Build and Package iOS App
    runs-on: macos-latest # 使用 GitHub 提供的最新 macOS 服务器

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # 拉取所有子模块（如果有的话）

      - name: Setup Node.js (For Monaco Editor/Web dependencies)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (if needed)
        run: |
          if [ -f "package.json" ]; then
            npm install
          fi
          if [ -f "Podfile" ]; then
            sudo gem install cocoapods
            pod install
          fi

      - name: Build and Archive
        run: |
          # 告诉 Xcode 编译时不进行签名验证 (CODE_SIGNING_ALLOWED=NO)
          xcodebuild archive \
            -workspace CodeApp.xcworkspace \
            -scheme CodeApp \
            -configuration Release \
            -archivePath $PWD/build/CodeApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package to IPA
        run: |
          # 将编译好的 .app 文件打包成 .ipa 格式
          mkdir -p Payload
          cp -r build/CodeApp.xcarchive/Products/Applications/*.app Payload/
          zip -r CodeApp.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: CodeApp.ipa
          retention-days: 3 # 保留 3 天供你下载
