name: Build Unsigned IPA for CodeApp

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build and Archive
        run: |
          # 自动判断使用 workspace 还是 xcodeproj
          if [ -d "Code.xcworkspace" ]; then
            TARGET="-workspace Code.xcworkspace"
          else
            TARGET="-project Code.xcodeproj"
          fi
          
          # 核心修复：让 Xcode 自己列出并提取真实的 Scheme 名字
          SCHEME=$(xcodebuild -list -json | jq -r '.project.schemes[0] // .workspace.schemes[0]')
          
          echo "=> 正在使用目标: $TARGET"
          echo "=> 自动探测到真实的 Scheme 为: $SCHEME"

          xcodebuild archive \
            $TARGET \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath $PWD/build/CodeApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # 将编译出的 .app 提取并压缩为标准 .ipa 格式
          cp -r build/CodeApp.xcarchive/Products/Applications/*.app Payload/
          zip -r CodeApp.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: CodeApp.ipa
          retention-days: 3
